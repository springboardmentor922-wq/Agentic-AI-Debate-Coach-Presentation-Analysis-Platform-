<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">End-to-End System Workflow</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">User Lifecycle &amp; Core Platform Interaction Loop</text>

  <!-- Step 1: User Registration & Login -->
  <rect x="60" y="100" width="240" height="110" rx="10" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="130" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">1. Authentication</text>
  <text x="180" y="155" text-anchor="middle" fill="#cbd5e1" font-size="11">User Registration / Login</text>
  <text x="180" y="175" text-anchor="middle" fill="#cbd5e1" font-size="11">JWT Token &amp; Role Assign</text>

  <line x1="300" y1="155" x2="370" y2="155" stroke="#3b82f6" stroke-width="2"/>

  <!-- Step 2: Dashboard & Mode Selection -->
  <rect x="370" y="100" width="260" height="110" rx="10" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="130" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="bold">2. Dashboard Hub</text>
  <text x="500" y="155" text-anchor="middle" fill="#cbd5e1" font-size="11">Select Topic &amp; Mode</text>
  <text x="500" y="175" text-anchor="middle" fill="#cbd5e1" font-size="11">Speech Studio OR AI Debate</text>

  <line x1="630" y1="155" x2="700" y2="155" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Path A: Speech Studio -->
  <rect x="700" y="90" width="240" height="60" rx="8" fill="url(#card-grad)" stroke="#10b981" stroke-width="2"/>
  <text x="820" y="115" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">A. Live Speech Studio</text>
  <text x="820" y="135" text-anchor="middle" fill="#cbd5e1" font-size="10">Web Audio Canvas + Web Speech STT</text>

  <!-- Path B: AI Debate Room -->
  <rect x="700" y="165" width="240" height="60" rx="8" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="190" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">B. AI Debate Room</text>
  <text x="820" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">Multi-turn Agent Simulator</text>

  <!-- Flow downwards -->
  <line x1="820" y1="225" x2="820" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <line x1="820" y1="280" x2="500" y2="280" stroke="#10b981" stroke-width="2"/>
  <line x1="500" y1="280" x2="500" y2="330" stroke="#10b981" stroke-width="2"/>

  <!-- Step 3: Real-Time AI NLP Processing -->
  <rect x="250" y="330" width="500" height="120" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="360" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">3. Real-Time NLP &amp; Speech Processing Engine</text>
  <text x="500" y="385" text-anchor="middle" fill="#e2e8f0" font-size="12">• Logical Fallacy Detection (Ad Hominem, Straw Man, False Dilemma)</text>
  <text x="500" y="405" text-anchor="middle" fill="#e2e8f0" font-size="12">• Speech Pace (WPM) + Filler Word Counter ("um", "like", "basically")</text>
  <text x="500" y="425" text-anchor="middle" fill="#e2e8f0" font-size="12">• Persona Opponent Rebuttal Synthesis (Socrates / Pragmatist / Aggressor)</text>

  <line x1="500" y1="450" x2="500" y2="500" stroke="#10b981" stroke-width="2"/>

  <!-- Step 4: Analytics & Export -->
  <rect x="200" y="500" width="600" height="100" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-width="2"/>
  <text x="500" y="530" text-anchor="middle" fill="#f472b6" font-size="15" font-weight="bold">4. Analytics, Scoring &amp; Export</text>
  <text x="500" y="555" text-anchor="middle" fill="#e2e8f0" font-size="12">Skill Radar Plot Updates + Fallacy Breakdown + Historical Session Logs</text>
  <text x="500" y="575" text-anchor="middle" fill="#e2e8f0" font-size="12">Export Executive Summary PDF (ReportLab) &amp; OpenPyXL Excel Metrics</text>
</svg>
