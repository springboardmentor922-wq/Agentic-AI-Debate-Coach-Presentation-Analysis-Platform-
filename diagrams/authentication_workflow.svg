<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Authentication &amp; Security Workflow</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">JWT Token Lifecycle &amp; Role-Based Access Control (RBAC)</text>

  <!-- Client Side -->
  <rect x="50" y="110" width="220" height="380" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">React Frontend</text>
  
  <rect x="70" y="165" width="180" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="160" y="195" text-anchor="middle" fill="#cbd5e1" font-size="11">1. User Enters Credentials</text>
  
  <rect x="70" y="265" width="180" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="160" y="295" text-anchor="middle" fill="#cbd5e1" font-size="11">4. Store JWT in LocalStorage</text>

  <rect x="70" y="365" width="180" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="160" y="395" text-anchor="middle" fill="#cbd5e1" font-size="11">5. Redirect to Dashboard</text>

  <!-- Backend API -->
  <rect x="340" y="110" width="220" height="380" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="bold">FastAPI Auth Router</text>

  <rect x="360" y="165" width="180" height="50" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
  <text x="450" y="195" text-anchor="middle" fill="#ddd6fe" font-size="11">2. POST /api/auth/login</text>

  <rect x="360" y="265" width="180" height="50" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
  <text x="450" y="295" text-anchor="middle" fill="#ddd6fe" font-size="11">3. Generate Signed JWT Token</text>

  <!-- Database -->
  <rect x="630" y="110" width="220" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="740" y="140" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">Database (SQLite/Postgres)</text>

  <rect x="650" y="165" width="180" height="50" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="740" y="195" text-anchor="middle" fill="#a7f3d0" font-size="11">Query User by Email</text>

  <rect x="650" y="265" width="180" height="50" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="740" y="295" text-anchor="middle" fill="#a7f3d0" font-size="11">Verify Bcrypt Password Hash</text>

  <!-- Connectors -->
  <line x1="250" y1="190" x2="360" y2="190" stroke="#3b82f6" stroke-width="2"/>
  <line x1="540" y1="190" x2="650" y2="190" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="650" y1="290" x2="540" y2="290" stroke="#10b981" stroke-width="2"/>
  <line x1="360" y1="290" x2="250" y2="290" stroke="#8b5cf6" stroke-width="2"/>
</svg>
