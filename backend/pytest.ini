[pytest]
asyncio_mode = auto
testpaths = tests
# Hard per-test timeout. The suite is meant to be fully hermetic (in-memory
# mock DB, no real LLM/SMTP/Twilio/OAuth network calls — see conftest.py),
# so no test should ever legitimately take anywhere near this long. If one
# does hang, that almost always means a real network call slipped through
# (e.g. a credential leaking in from .env that conftest didn't blank out) —
# fail fast with a clear timeout instead of hanging CI indefinitely.
timeout = 30
timeout_method = thread
