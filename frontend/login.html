<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Debate Coach Login</title>

<link rel="stylesheet" href="login.css">

<style>
#message{
    text-align:center;
    margin-bottom:15px;
    color:#ff6b6b;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🎤 AI Debate Coach
    </div>

    <h2>Login</h2>

    <form id="loginForm">

        <div id="message"></div>

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>
        </div>

        <button type="submit">
            Login
        </button>

        <div class="register">
            New User?
            <a href="register.html">
                Register Here
            </a>
        </div>

    </form>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    try{

        const response =
        await fetch(
            "http://127.0.0.1:8000/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:email,
                    password:password
                })
            }
        );

        const data =
        await response.json();

        console.log("LOGIN RESPONSE:", data);

        if(data.success){

            localStorage.setItem(
                "username",
                data.username || ""
            );

            localStorage.setItem(
                "fullname",
                data.fullname || data.username || ""
            );

            localStorage.setItem(
                "email",
                data.email || email
            );

            localStorage.setItem(
                "role",
                data.role || "Learner"
            );

            if(data.role === "Learner"){
                window.location.href =
                "learner.html";
            }
            else if(data.role === "Admin"){
                window.location.href =
                "admin.html";
            }
            else if(data.role === "Educator"){
                window.location.href =
                "educator.html";
            }
            else if(data.role === "Debate Coach"){
                window.location.href =
                "coach.html";
            }

        }
        else{

            document.getElementById("message")
            .innerText =
            data.message;
        }

    }
    catch(error){

        console.error(error);

        document.getElementById("message")
        .innerText =
        "Unable to connect to backend";

    }

});

</script>

</body>
</html>
