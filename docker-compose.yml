version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=PRODUCTION_SECRET_KEY_GOES_HERE_19283719283
      - DATABASE_URL=sqlite:////workspace/debate_coach.db
    volumes:
      - backend-db:/workspace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-db:
