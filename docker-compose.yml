version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: debate_coach_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mani2112
      POSTGRES_DB: debate_coach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6-jammy
    container_name: debate_coach_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debate_coach_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:Mani2112@postgres:5432/debate_coach_db
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=agentic_ai_debate_coach
      - SECRET_KEY=production-secret-key-change-me
      - ALGORITHM=HS256
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debate_coach_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:
