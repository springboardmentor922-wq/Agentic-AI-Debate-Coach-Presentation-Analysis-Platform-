name: CI

# Runs on every push/PR so a broken backend test or a frontend build failure
# is caught before merge, per the "CI/CD" completion requirement. This
# workflow deliberately does NOT deploy anything and does NOT need any
# secrets: the backend test suite is fully hermetic (in-memory mock DB, no
# real LLM/SMTP/Twilio/OAuth calls — see backend/tests/conftest.py), and the
# frontend job only verifies the production bundle builds. No API keys,
# database URIs, or other credentials are read or exposed anywhere here.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        # No .env / secrets needed: conftest.py forces MONGO_URI, JWT secret,
        # and every external-provider credential (OpenAI/Anthropic/SMTP/
        # Twilio/Google) to safe test values before the app is even
        # imported, so this job never talks to a real external service.
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle
        # Dummy, non-secret placeholder values — Vite inlines VITE_* at
        # build time, but no real backend or Google client ID is needed to
        # verify the bundle compiles.
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_GOOGLE_CLIENT_ID: ""
        run: npm run build

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: debate-coach-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: debate-coach-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
